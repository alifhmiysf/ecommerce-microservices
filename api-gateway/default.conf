server {
    listen 80;

    # Set timeout lebih lama agar tidak 504 saat debugging
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

location /users/ {
        # WAJIB pakai slash / di akhir port 8000 agar prefix /users/ dipotong
        proxy_pass http://user-service:8000/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /products/ {
        proxy_pass http://product-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

location /transactions/ {
        # Tambahkan / di akhir 8000 agar prefix /transactions/ dipotong
        proxy_pass http://transaction-service:8000/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /transactions;
    }
}