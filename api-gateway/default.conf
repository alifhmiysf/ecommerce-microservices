server {
    listen 80;

    location /users/ {
        # Menghapus prefix /users agar Laravel menerima path yang bersih
        rewrite ^/users/(.*)$ /$1 break;
        
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /products {
        proxy_pass http://product-service:8000;
        rewrite ^/products/(.*)$ /$1 break;
    }
    # ... (blok users dan products sudah ada di atas) ...

    # === TAMBAHKAN INI ===
    location /transactions {
        proxy_pass http://transaction-service:8000;
        rewrite ^/transactions/(.*)$ /$1 break;
    }
}