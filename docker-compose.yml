services:
  # API Gateway
  gateway:
    image: nginx:alpine
    container_name: eco-gateway
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eco-network
    depends_on:
      - user-service

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: eco-user-service
    ports:
      - "8000:8000"
    volumes:
      - ./user-service:/var/www
    networks:
      - eco-network
    depends_on:
      - db-user

  # Database User
  db-user:
    image: mysql:8.0
    container_name: eco-db-user
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: password
    networks:
      - eco-network

  # Database Product
  db-product:
    image: postgres:15-alpine
    container_name: eco-db-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_PASSWORD: password
    networks:
      - eco-network

networks:
  eco-network:
    driver: bridge