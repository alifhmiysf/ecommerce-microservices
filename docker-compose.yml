services:
  # =========================================
  # 1. API GATEWAY
  # =========================================
  gateway:
    image: nginx:alpine
    container_name: eco-gateway
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eco-network
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      transaction-service:
        condition: service_started

  # =========================================
  # 2. USER SERVICE
  # =========================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: eco-user-service
    working_dir: /var/www
    volumes:
      - ./user-service:/var/www
    # --- AUTO RUN SERVER ---
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: always
    networks:
      - eco-network
    depends_on:
      db-user:
        condition: service_healthy

  db-user:
    image: mysql:8.0
    container_name: eco-db-user
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql_user_data:/var/lib/mysql
    networks:
      - eco-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  # =========================================
  # 3. PRODUCT SERVICE
  # =========================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: eco-product-service
    working_dir: /var/www
    volumes:
      - ./product-service:/var/www
    # --- AUTO RUN SERVER ---
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: always
    networks:
      - eco-network
    depends_on:
      db-product:
        condition: service_healthy

  db-product:
    image: postgres:15-alpine
    container_name: eco-db-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - product_db_data:/var/lib/postgresql/data
    networks:
      - eco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================
  # 4. TRANSACTION SERVICE
  # =========================================
  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: eco-transaction-service
    working_dir: /var/www
    volumes:
      - ./transaction-service:/var/www
    # --- AUTO RUN SERVER ---
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: always
    networks:
      - eco-network
    depends_on:
      db-transaction:
        condition: service_healthy

  db-transaction:
    image: mysql:8.0
    container_name: eco-db-transaction
    environment:
      MYSQL_DATABASE: transaction_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql_transaction_data:/var/lib/mysql
    networks:
      - eco-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

# =========================================
# GLOBAL
# =========================================
networks:
  eco-network:
    driver: bridge

volumes:
  mysql_user_data:
  product_db_data:
  mysql_transaction_data: